<!-- Delivery Store — Full Store + Checkout + Order Tracking -->
<style>
  .consign-product-card{transition:transform .2s,box-shadow .2s}
  .consign-product-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,212,255,0.15)}
  .consign-badge{position:absolute;top:12px;right:12px;background:rgba(0,212,255,0.2);color:#00d4ff;padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;backdrop-filter:blur(8px);border:1px solid rgba(0,212,255,0.3)}
  #consignCartCount{background:#00d4ff;color:#000;font-size:0.65rem;min-width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;position:absolute;top:-6px;right:-8px}
</style>

<div style="max-width:1200px;margin:0 auto;padding:clamp(1rem,3vw,2rem)">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem">
  <div>
    <h2 style="color:#00d4ff;margin:0 0 0.3rem;display:flex;align-items:center;gap:0.5rem"><img src="/images/logo.png" alt="QS" style="height:28px;width:28px;object-fit:contain;border-radius:6px"> Delivery Store</h2>
    <p style="color:#a0a0c0;margin:0;font-size:0.9rem">Premium Tesla & Optimus products — Delivery pricing with secure checkout</p>
  </div>
  <div style="display:flex;gap:0.5rem;align-items:center">
    <button class="btn btn-outline btn-sm" onclick="window.consignShowCart()" style="position:relative">🛒 Cart<span id="consignCartCount" style="display:none">0</span></button>
    <button class="btn btn-outline btn-sm" onclick="window.consignShowTrack()">📦 Track Order</button>
    <button class="btn btn-outline btn-sm" onclick="window.consignShowDeliveries()">🚚 My Deliveries</button>
  </div>
</div>
<div id="consignContent"></div>
</div>

<script>
const CONSIGN_PRODUCTS = [
  {id:'tesla-model-s', name:'Tesla Model S', price:79990, image:'/images/tesla-model-s.jpg', desc:'The ultimate luxury sedan. 0-60 in 1.99s, 396mi range, autopilot.', tag:'Sedan'},
  {id:'tesla-model-y', name:'Tesla Model Y', price:49990, image:'/images/tesla-model-y.jpg', desc:'Versatile compact SUV. 0-60 in 3.5s, 310mi range, spacious interior.', tag:'SUV'},
  {id:'tesla-model-3', name:'Tesla Model 3', price:42990, image:'/images/tesla-model-3.jpg', desc:'Affordable performance sedan. 0-60 in 3.1s, 358mi range, minimalist design.', tag:'Sedan'},
  {id:'tesla-model-x', name:'Tesla Model X', price:89990, image:'/images/tesla-model-x.jpg', desc:'Falcon-wing luxury SUV. 0-60 in 2.5s, 333mi range, iconic doors.', tag:'SUV'},
  {id:'tesla-cybertruck', name:'Tesla Cybertruck', price:69990, image:'/images/tesla-cybertruck.jpg', desc:'Futuristic all-electric truck. Stainless steel exoskeleton, adaptive air suspension.', tag:'Truck'},
  {id:'optimus-bot', name:'Optimus Bot', price:25000, image:'/images/optimus-bot.jpg', desc:'Humanoid general-purpose robot. AI-powered, autonomous tasks, revolutionary.', tag:'Robot'}
];

const BTC_WALLET = 'bc1q04k3fuas4eratzmv9padu9zjf7dwh4xv0s23k6';

// Shipping fees per product (paid via Bitcoin separately)
const SHIPPING_FEES = {
  'tesla-model-s': 2500,
  'tesla-model-y': 2000,
  'tesla-model-3': 1800,
  'tesla-model-x': 2800,
  'tesla-cybertruck': 3000,
  'optimus-bot': 500
};

let _consignCart = [];
try { _consignCart = JSON.parse(localStorage.getItem('qsx_consign_cart')||'[]'); } catch(e){}

function getProductTotal() { return _consignCart.reduce((s, i) => s + i.price * i.qty, 0); }
function getShippingTotal() { return _consignCart.reduce((s, i) => s + (SHIPPING_FEES[i.id]||0) * i.qty, 0); }

// ========== CATALOG ==========
window.consignShowCatalog = function() {
  const el = document.getElementById('consignContent');
  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:1.5rem">';
  CONSIGN_PRODUCTS.forEach(p => {
    const ship = SHIPPING_FEES[p.id]||0;
    html += `<div class="glass consign-product-card" style="padding:0;overflow:hidden;position:relative">
      <div class="consign-badge">${p.tag}</div>
      <img src="${p.image}" alt="${p.name}" style="width:100%;height:220px;object-fit:cover;display:block">
      <div style="padding:1.2rem">
        <h3 style="color:#fff;margin:0 0 0.3rem;font-size:1.1rem">${p.name}</h3>
        <p style="color:#a0a0c0;font-size:0.85rem;margin:0 0 1rem;line-height:1.5">${p.desc}</p>
        <div style="margin-bottom:0.8rem">
          <span style="font-size:1.3rem;font-weight:700;color:#00d4ff">$${p.price.toLocaleString()}</span>
          <span style="color:#f7931a;font-size:0.75rem;margin-left:0.5rem">+ $${ship.toLocaleString()} shipping (₿ BTC)</span>
        </div>
        <button class="btn btn-primary btn-sm" style="width:100%" onclick="window.consignAddToCart('${p.id}')">ADD TO CART</button>
      </div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
  window.consignUpdateCartBadge();
};

// ========== CART ==========
window.consignAddToCart = function(productId) {
  const p = CONSIGN_PRODUCTS.find(x => x.id === productId);
  if (!p) return;
  const existing = _consignCart.find(x => x.id === productId);
  if (existing) { existing.qty++; }
  else { _consignCart.push({id: p.id, name: p.name, price: p.price, qty: 1}); }
  localStorage.setItem('qsx_consign_cart', JSON.stringify(_consignCart));
  showToast(`${p.name} added to cart!`, 'success');
  window.consignUpdateCartBadge();
};

window.consignRemoveFromCart = function(productId) {
  _consignCart = _consignCart.filter(x => x.id !== productId);
  localStorage.setItem('qsx_consign_cart', JSON.stringify(_consignCart));
  window.consignShowCart();
};

window.consignUpdateCartBadge = function() {
  const badge = document.getElementById('consignCartCount');
  const total = _consignCart.reduce((s, i) => s + i.qty, 0);
  if (badge) { badge.textContent = total; badge.style.display = total > 0 ? 'inline-flex' : 'none'; }
};

window.consignShowCart = function() {
  const el = document.getElementById('consignContent');
  if (!_consignCart.length) {
    el.innerHTML = `<div class="glass" style="padding:3rem;text-align:center">
      <p style="font-size:2rem;margin:0">🛒</p>
      <h3 style="color:#e0e0e0;margin:1rem 0 0.5rem">Your cart is empty</h3>
      <p style="color:#a0a0c0;margin-bottom:1.5rem">Browse our products and add items to your cart</p>
      <button class="btn btn-primary" onclick="window.consignShowCatalog()">Continue Shopping</button>
    </div>`;
    window.consignUpdateCartBadge();
    return;
  }

  const prodTotal = getProductTotal();
  const shipTotal = getShippingTotal();
  const grandTotal = prodTotal + shipTotal;

  let html = `<div style="margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center">
    <h3 style="color:#00d4ff;margin:0">🛒 Shopping Cart (${_consignCart.length} item${_consignCart.length>1?'s':''})</h3>
    <button class="btn btn-outline btn-sm" onclick="window.consignShowCatalog()">← Continue Shopping</button>
  </div>`;

  _consignCart.forEach(item => {
    const p = CONSIGN_PRODUCTS.find(x => x.id === item.id);
    const ship = SHIPPING_FEES[item.id]||0;
    html += `<div class="glass" style="padding:1rem;margin-bottom:0.8rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
      <img src="${p?p.image:'/images/hero-starship.jpg'}" alt="${item.name}" style="width:80px;height:60px;object-fit:cover;border-radius:8px">
      <div style="flex:1;min-width:150px">
        <strong style="color:#fff;font-size:1rem">${item.name}</strong>
        <p style="color:#a0a0c0;font-size:0.85rem;margin:0.2rem 0 0">Qty: ${item.qty} × $${item.price.toLocaleString()}</p>
        <p style="color:#f7931a;font-size:0.75rem;margin:0.1rem 0 0">₿ Shipping: ${item.qty} × $${ship.toLocaleString()}</p>
      </div>
      <div style="text-align:right">
        <strong style="color:#00d4ff;font-size:1.1rem">$${(item.price * item.qty).toLocaleString()}</strong><br>
        <span style="color:#f7931a;font-size:0.75rem">+ $${(ship * item.qty).toLocaleString()} ship</span>
      </div>
      <button class="btn btn-danger btn-sm" onclick="window.consignRemoveFromCart('${item.id}')">✕</button>
    </div>`;
  });

  html += `<div class="glass" style="padding:1.5rem;margin-top:1rem">
    <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span style="color:#a0a0c0;font-size:0.9rem">Product Total:</span>
      <span style="color:#fff;font-size:1rem;font-weight:600">$${prodTotal.toLocaleString()}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(247,147,26,0.3)">
      <span style="color:#f7931a;font-size:0.9rem">🚚 Shipping Fee (₿ Bitcoin only):</span>
      <span style="color:#f7931a;font-size:1rem;font-weight:600">$${shipTotal.toLocaleString()}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:0.8rem 0;margin-top:0.5rem">
      <span style="color:#fff;font-size:1.1rem;font-weight:700">Grand Total:</span>
      <span style="color:#00d4ff;font-size:1.5rem;font-weight:700">$${grandTotal.toLocaleString()}</span>
    </div>
    <div style="margin-top:1rem;display:flex;justify-content:flex-end">
      <button class="btn btn-primary" style="padding:0.8rem 2rem;font-size:1rem" onclick="window.consignShowCheckout()">Proceed to Checkout →</button>
    </div>
  </div>`;

  el.innerHTML = html;
  window.consignUpdateCartBadge();
};

// ========== CHECKOUT ==========
window.consignShowCheckout = function() {
  if (!_consignCart.length) return window.consignShowCart();
  const prodTotal = getProductTotal();
  const shipTotal = getShippingTotal();
  const grandTotal = prodTotal + shipTotal;
  const el = document.getElementById('consignContent');

  let html = `<div style="margin-bottom:1.5rem"><button class="btn btn-outline btn-sm" onclick="window.consignShowCart()">← Back to Cart</button></div>
  <h3 style="color:#00d4ff;margin-bottom:1.5rem">🔒 Secure Checkout</h3>
  <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;max-width:700px">`;

  // Contact info
  html += `<div class="glass" style="padding:1.5rem">
    <h4 style="color:#e0e0e0;margin:0 0 1rem">📧 Contact Information</h4>
    <div class="form-group"><label>Full Name *</label><input id="coName" placeholder="John Doe" style="width:100%;padding:0.7rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:1rem"></div>
    <div class="form-group"><label>Email *</label><input id="coEmail" type="email" placeholder="you@example.com" style="width:100%;padding:0.7rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:1rem"></div>
    <div class="form-group"><label>Phone (optional)</label><input id="coPhone" type="tel" placeholder="+1 234 567 890" style="width:100%;padding:0.7rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:1rem"></div>
  </div>`;

  // Shipping address
  html += `<div class="glass" style="padding:1.5rem">
    <h4 style="color:#e0e0e0;margin:0 0 1rem">🚚 Shipping Address</h4>
    <div class="form-group"><label>Address *</label><textarea id="coAddress" rows="3" placeholder="Full shipping address including city, state, zip, country" style="width:100%;padding:0.7rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:1rem;resize:vertical;font-family:inherit"></textarea></div>
  </div>`;

  // Payment method for PRODUCT price
  html += `<div class="glass" style="padding:1.5rem">
    <h4 style="color:#e0e0e0;margin:0 0 1rem">💳 Payment Method (Product Price)</h4>
    <p style="color:#a0a0c0;font-size:0.85rem;margin:0 0 1rem">Choose how to pay for your product ($${prodTotal.toLocaleString()})</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:0.8rem" id="coPayMethods">
      <label class="glass" style="padding:0.8rem;display:flex;align-items:center;gap:0.5rem;cursor:pointer;border:2px solid rgba(0,212,255,0.4);border-radius:10px">
        <input type="radio" name="coPayment" value="bitcoin" checked style="accent-color:#00d4ff"> <img src="/images/bitcoin.png" style="height:24px;width:24px;object-fit:contain"> <span style="color:#fff;font-size:0.9rem">Bitcoin</span>
      </label>
      <label class="glass" style="padding:0.8rem;display:flex;align-items:center;gap:0.5rem;cursor:pointer;border-radius:10px">
        <input type="radio" name="coPayment" value="cashapp" style="accent-color:#00d4ff"> <img src="/images/cashapp.png" style="height:24px;width:24px;object-fit:contain"> <span style="color:#fff;font-size:0.9rem">Cash App</span>
      </label>
      <label class="glass" style="padding:0.8rem;display:flex;align-items:center;gap:0.5rem;cursor:pointer;border-radius:10px">
        <input type="radio" name="coPayment" value="paypal" style="accent-color:#00d4ff"> <img src="/images/paypal.png" style="height:24px;width:24px;object-fit:contain"> <span style="color:#fff;font-size:0.9rem">PayPal</span>
      </label>
      <label class="glass" style="padding:0.8rem;display:flex;align-items:center;gap:0.5rem;cursor:pointer;border-radius:10px">
        <input type="radio" name="coPayment" value="zelle" style="accent-color:#00d4ff"> <img src="/images/zelle.png" style="height:24px;width:24px;object-fit:contain"> <span style="color:#fff;font-size:0.9rem">Zelle</span>
      </label>
      <label class="glass" style="padding:0.8rem;display:flex;align-items:center;gap:0.5rem;cursor:pointer;border-radius:10px">
        <input type="radio" name="coPayment" value="wire" style="accent-color:#00d4ff"> <img src="/images/wire-transfer.png" style="height:24px;width:24px;object-fit:contain"> <span style="color:#fff;font-size:0.9rem">Wire Transfer</span>
      </label>
      <label class="glass" style="padding:0.8rem;display:flex;align-items:center;gap:0.5rem;cursor:pointer;border-radius:10px">
        <input type="radio" name="coPayment" value="western-union" style="accent-color:#00d4ff"> <img src="/images/western-union.png" style="height:24px;width:24px;object-fit:contain"> <span style="color:#fff;font-size:0.9rem">Western Union</span>
      </label>
    </div>
    <div id="coPayInfo" style="margin-top:1rem"></div>
  </div>`;

  // Shipping fee — ALWAYS Bitcoin
  html += `<div class="glass" style="padding:1.5rem;border-left:3px solid #f7931a">
    <h4 style="color:#f7931a;margin:0 0 0.8rem">₿ Shipping Fee Payment (Bitcoin Only)</h4>
    <p style="color:#a0a0c0;font-size:0.85rem;margin:0 0 0.5rem">Shipping fee of <strong style="color:#fff">$${shipTotal.toLocaleString()}</strong> must be paid via Bitcoin to:</p>
    <p style="color:#fff;font-family:monospace;font-size:0.9rem;word-break:break-all;margin:0 0 0.8rem;background:rgba(0,0,0,0.3);padding:0.8rem;border-radius:8px">${BTC_WALLET}</p>
    <button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText('${BTC_WALLET}');showToast('Copied!','success')">📋 Copy Wallet Address</button>
    <p style="color:#555;font-size:0.75rem;margin-top:0.8rem">Shipping is paid separately from the product price via Bitcoin only.</p>
  </div>`;

  // Order summary
  html += `<div class="glass" style="padding:1.5rem;border-top:3px solid #00d4ff">
    <h4 style="color:#e0e0e0;margin:0 0 1rem">📋 Order Summary</h4>`;
  _consignCart.forEach(item => {
    const ship = SHIPPING_FEES[item.id]||0;
    html += `<div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span style="color:#e0e0e0">${item.name} × ${item.qty}</span>
      <span style="color:#fff;font-weight:600">$${(item.price * item.qty).toLocaleString()}</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:0.2rem 0 0.4rem;border-bottom:1px solid rgba(247,147,26,0.15)">
      <span style="color:#f7931a;font-size:0.8rem;padding-left:1rem">↳ Shipping (₿ BTC)</span>
      <span style="color:#f7931a;font-size:0.85rem">$${(ship * item.qty).toLocaleString()}</span>
    </div>`;
  });
  html += `<div style="display:flex;justify-content:space-between;padding:0.4rem 0;margin-top:0.5rem;border-top:1px solid rgba(255,255,255,0.1)">
    <span style="color:#a0a0c0;font-size:0.9rem">Product Total:</span>
    <span style="color:#fff;font-size:1rem;font-weight:600">$${prodTotal.toLocaleString()}</span>
  </div>
  <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:2px solid rgba(0,212,255,0.3)">
    <span style="color:#f7931a;font-size:0.9rem">🚚 Shipping (₿ Bitcoin):</span>
    <span style="color:#f7931a;font-size:1rem;font-weight:600">$${shipTotal.toLocaleString()}</span>
  </div>
  <div style="display:flex;justify-content:space-between;padding:0.8rem 0;margin-top:0.5rem">
    <span style="color:#fff;font-size:1.1rem;font-weight:700">Grand Total:</span>
    <span style="color:#00d4ff;font-size:1.3rem;font-weight:700">$${grandTotal.toLocaleString()}</span>
  </div>`;

  html += `<div style="margin-top:1.5rem;display:flex;gap:0.5rem;flex-wrap:wrap">
    <button class="btn btn-primary" style="flex:1;padding:1rem;font-size:1.05rem;font-weight:700" onclick="window.consignPlaceOrder()">🔒 Place Order</button>
    <button class="btn btn-outline" onclick="window.consignShowCart()">← Back</button>
  </div>
  <p style="color:#555;font-size:0.75rem;margin-top:1rem;text-align:center">Product price and shipping fee are paid separately. Shipping is always via Bitcoin.</p>
  </div>`;

  html += '</div>';
  el.innerHTML = html;

  // Highlight selected payment
  document.querySelectorAll('#coPayMethods label').forEach(l => {
    l.addEventListener('click', () => {
      document.querySelectorAll('#coPayMethods label').forEach(x => x.style.borderColor = 'transparent');
      l.style.borderColor = 'rgba(0,212,255,0.4)';
      const val = l.querySelector('input').value;
      const info = document.getElementById('coPayInfo');
      if (val === 'bitcoin') {
        info.innerHTML = `<div class="glass" style="padding:0.8rem;border-left:3px solid #f7931a"><p style="color:#f7931a;font-weight:600;margin:0 0 0.3rem">₿ Send Bitcoin to:</p><p style="color:#fff;font-family:monospace;font-size:0.85rem;word-break:break-all;margin:0">${BTC_WALLET}</p><button class="btn btn-outline btn-sm" style="margin-top:0.5rem" onclick="navigator.clipboard.writeText('${BTC_WALLET}');showToast('Copied!','success')">📋 Copy</button></div>`;
      } else {
        info.innerHTML = `<div class="glass" style="padding:0.8rem;border-left:3px solid #f59e0b"><p style="color:#f59e0b;font-weight:600;margin:0 0 0.3rem">📩 Payment Details</p><p style="color:#a0a0c0;font-size:0.85rem;margin:0">After placing your order, admin will send you payment instructions via email/inbox message.</p></div>`;
      }
    });
  });
  document.querySelector('#coPayMethods input[value="bitcoin"]').click();
};

// ========== PLACE ORDER ==========
window.consignPlaceOrder = async function() {
  const name = document.getElementById('coName').value.trim();
  const email = document.getElementById('coEmail').value.trim();
  const phone = document.getElementById('coPhone').value.trim();
  const address = document.getElementById('coAddress').value.trim();
  const payment = document.querySelector('input[name="coPayment"]:checked')?.value || 'bitcoin';

  if (!name) return showToast('Please enter your name', 'error');
  if (!email || !email.includes('@')) return showToast('Please enter a valid email', 'error');
  if (!address) return showToast('Please enter a shipping address', 'error');

  const prodTotal = getProductTotal();
  const shipTotal = getShippingTotal();
  const grandTotal = prodTotal + shipTotal;
  const el = document.getElementById('consignContent');
  el.innerHTML = '<div style="text-align:center;padding:3rem"><p style="font-size:2rem">⏳</p><p style="color:#a0a0c0">Placing your order...</p></div>';

  try {
    const API_KEY = 'qsx_d61ef3d51b3fd7880ac5d5fa9d572caf0fe281d69e12c127';
    let orderResult = null;
    const token = localStorage.getItem('token');

    if (token) {
      for (const item of _consignCart) {
        const dep = await (await fetch('/api/user/deposit', {
          method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
          body: JSON.stringify({amount: item.price * item.qty, payment_method: payment})
        })).json();
        if (dep.error) throw new Error(dep.error);
        const order = await (await fetch('/api/shop/order', {
          method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
          body: JSON.stringify({user_id: 0, product_name: item.name, product_price: item.price * item.qty, quantity: item.qty, payment_method: payment, shipping_address: address})
        })).json();
        if (order.error) throw new Error(order.error);
        if (!orderResult) orderResult = {ref: order.reference, depRef: dep.reference};
      }
    } else {
      for (const item of _consignCart) {
        const r = await (await fetch('/api/external/checkout', {
          method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': API_KEY},
          body: JSON.stringify({product_id: item.id, customer_email: email, customer_name: name, customer_phone: phone, payment_method: payment, shipping_address: address})
        })).json();
        if (r.error) throw new Error(r.error);
        if (!orderResult) orderResult = {ref: r.order.reference, depRef: r.deposit.reference};
      }
    }

    _consignCart = [];
    localStorage.removeItem('qsx_consign_cart');
    window.consignUpdateCartBadge();

    el.innerHTML = `<div style="max-width:600px;margin:0 auto;text-align:center">
      <div style="font-size:3rem;margin-bottom:1rem">✅</div>
      <h2 style="color:#22c55e;margin:0 0 0.5rem">Order Placed Successfully!</h2>
      <p style="color:#a0a0c0;font-size:1rem;margin-bottom:2rem">Thank you, ${name}! Your delivery order has been submitted.</p>

window.consignTrackOrder = async function() {
  const ref = document.getElementById('trackRef').value.trim();
  const email = document.getElementById('trackEmail').value.trim();
  if (!ref) return showToast('Enter order reference', 'error');
  if (!email) return showToast('Enter your email', 'error');
  const div = document.getElementById('trackResult');
  div.innerHTML = '<p style="color:#a0a0c0">Looking up your order...</p>';

  try {
    const API_KEY = 'qsx_d61ef3d51b3fd7880ac5d5fa9d572caf0fe281d69e12c127';
    const r = await (await fetch('/api/external/order/' + ref, {headers: {'X-API-Key': API_KEY}})).json();
    if (r.error) { div.innerHTML = `<div class="glass" style="padding:1.5rem;text-align:center"><p style="color:#ff3232">❌ ${r.error}</p></div>`; return; }
    if (r.customer && r.customer.email && r.customer.email.toLowerCase() !== email.toLowerCase()) { div.innerHTML = `<div class="glass" style="padding:1.5rem;text-align:center"><p style="color:#ff3232">❌ Email does not match this order.</p></div>`; return; }

    const statusMap = {
      pending: {icon: '⏳', label: 'Awaiting Payment', color: '#f59e0b', desc: 'Your order has been placed. Please complete payment.'},
      deposit_approved: {icon: '💰', label: 'Payment Confirmed', color: '#22c55e', desc: 'Payment received! Your order is being processed.'},
      approved: {icon: '✅', label: 'Order Approved', color: '#22c55e', desc: 'Your order has been approved and will be shipped soon.'},
      rejected: {icon: '❌', label: 'Order Rejected', color: '#ff3232', desc: 'Your order was rejected. Contact support for details.'},
      completed: {icon: '🎉', label: 'Completed', color: '#00d4ff', desc: 'Your order has been delivered!'}
    };
    const st = statusMap[r.status] || {icon: '📦', label: r.status, color: '#a0a0c0', desc: ''};

    div.innerHTML = `<div class="glass" style="padding:1.5rem">
      <div style="text-align:center;margin-bottom:1.5rem">
        <span style="font-size:2.5rem">${st.icon}</span>
        <h3 style="color:${st.color};margin:0.5rem 0 0.3rem">${st.label}</h3>
        <p style="color:#a0a0c0;font-size:0.9rem;margin:0">${st.desc}</p>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:1rem">
        <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="color:#a0a0c0;font-size:0.9rem">Order Ref</span><span style="color:#00d4ff;font-family:monospace;font-size:0.9rem">${r.reference}</span></div>
        <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="color:#a0a0c0;font-size:0.9rem">Product</span><span style="color:#fff;font-size:0.9rem">${r.product}</span></div>
        <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="color:#a0a0c0;font-size:0.9rem">Amount</span><span style="color:#fff;font-size:0.9rem">$${Number(r.price).toLocaleString()}</span></div>
        <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(247,147,26,0.3)"><span style="color:#f7931a;font-size:0.9rem">🚚 Shipping (₿ BTC)</span><span style="color:#f7931a;font-size:0.9rem">Paid via Bitcoin</span></div>
        <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="color:#a0a0c0;font-size:0.9rem">Payment</span><span style="color:#e0e0e0;font-size:0.9rem">${r.payment_method||'N/A'}</span></div>
        <div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid rgba(255,255,255,0.05)"><span style="color:#a0a0c0;font-size:0.9rem">Ships To</span><span style="color:#e0e0e0;font-size:0.9rem;max-width:250px;text-align:right">${r.shipping_address||'N/A'}</span></div>
        <div style="display:flex;justify-content:space-between;padding:0.4rem 0"><span style="color:#a0a0c0;font-size:0.9rem">Placed</span><span style="color:#555;font-size:0.85rem">${r.created_at ? new Date(r.created_at).toLocaleString() : 'N/A'}</span></div>
      </div>
      <div style="margin-top:1.5rem;text-align:center"><p style="color:#555;font-size:0.8rem;margin:0">Need help? Contact <a href="mailto:quantumspacex1@gmail.com" style="color:#00d4ff">quantumspacex1@gmail.com</a> or <a href="https://t.me/quantumspacex1" target="_blank" style="color:#00d4ff">Telegram</a></p></div>
    </div>`;
  } catch(e) {
    div.innerHTML = `<div class="glass" style="padding:1.5rem;text-align:center"><p style="color:#ff3232">Error tracking order. Please try again.</p></div>`;
  }
};

window.consignShowDeliveries = async function() {
  const el = document.getElementById('consignContent');
  const token = localStorage.getItem('token');
  if (!token) {
    el.innerHTML = '<div class="glass" style="padding:3rem;text-align:center"><p style="font-size:2rem;margin:0">🔒</p><h3 style="color:#e0e0e0;margin:1rem 0 0.5rem">Sign in to view your deliveries</h3><p style="color:#a0a0c0;margin-bottom:1.5rem">Log in to track your delivery status and view receipts</p><button class="btn btn-primary" onclick="showLogin()">Sign In</button></div>';
    return;
  }
  el.innerHTML = '<h3 style="color:#00d4ff">🚚 My Deliveries</h3><p style="color:#a0a0c0">Loading...</p>';
  try {
    const deliveries = await (await fetch('/api/user/deliveries', {headers:{'Authorization':'Bearer '+token}})).json();
    if (!deliveries.length) {
      el.innerHTML = '<div class="glass" style="padding:3rem;text-align:center"><p style="font-size:2rem;margin:0">🚚</p><h3 style="color:#e0e0e0;margin:1rem 0 0.5rem">No deliveries yet</h3><p style="color:#a0a0c0;margin-bottom:1.5rem">Place an order to see delivery tracking here</p><button class="btn btn-primary" onclick="window.consignShowCatalog()">Browse Products</button></div>';
      return;
    }
    let html = '<h3 style="color:#00d4ff;margin-bottom:1.5rem">🚚 My Deliveries</h3>';
    deliveries.forEach(d => {
      const sc = {preparing:'#f59e0b',dispatched:'#e879f9',in_transit:'#00d4ff',out_for_delivery:'#7b2ff7',delivered:'#22c55e'}[d.status]||'#a0a0c0';
      const si = {preparing:'📦',dispatched:'🚀',in_transit:'🚛',out_for_delivery:'🚗',delivered:'✅'}[d.status]||'📦';
      const sl = {preparing:'Preparing',dispatched:'Dispatched',in_transit:'In Transit',out_for_delivery:'Out for Delivery',delivered:'Delivered'}[d.status]||d.status;
      htmlD += '<div class="glass" style="padding:1.5rem;margin-bottom:1rem;border-left:3px solid '+sc+'">' +
        '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.8rem"><span style="font-size:1.5rem">'+si+'</span><h4 style="color:#fff;margin:0">'+(d.product_name||'Delivery #'+d.id)+'</h4><span style="background:'+sc+';color:#000;font-size:0.7rem;padding:3px 10px;border-radius:20px;font-weight:700">'+sl.toUpperCase()+'</span>' + (d.receipt_generated?'<span style="background:#22c55e;color:#000;font-size:0.65rem;padding:2px 8px;border-radius:20px;font-weight:700">🧾 RECEIPT</span>':'') + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 6fr;gap:0.5rem;font-size:0.85rem">' +
        '<div><span style="color:#a0a0c0">Product:</span> <span style="color:#fff">$'+Number(d.product_price).toFixed(2)+'</span></div>' +
        '<div><span style="color:#f7931a">Shipping (₿):</span> <span style="color:#fff">$'+Number(d.shipping_fee).toFixed(2)+'</span></div>' +
        '<div><span style="color:#a0a0c0">From:</span> <span style="color:#e0e0e0">'+(d.origin_location||'—')+'</span></div>' +
        '<div><span style="color:#a0a0c0">To:</span> <span style="color:#e0e0e0">'+(d.destination||'—')+'</span></div>' +
        (d.current_location?'<div style="grid-column:span 2"><span style="color:#00d4ff">📍 Current Location:</span> <span style="color:#fff">'+d.current_location+'</span></div>':'') +
        (d.carrier?'<div><span style="color:#a0a0c0">Carrier:</span> <span style="color:#e0e0e0">'+d.carrier+'</span></div>':'') +
        (d.tracking_number?'<div><span style="color:#a0a0c0">Tracking #:</span> <span style="color:#00d4ff;font-family:monospace">'+d.tracking_number+'</span></div>':'') +
        (d.driver_name?'<div><span style="color:#a0a0c0">Driver:</span> <span style="color:#e0e0e0">'+d.driver_name+'</span></div>':'') +
        (d.driver_phone?'<div><span style="color:#a0a0c0">Driver Phone:</span> <a href="tel:'+d.driver_phone+'" style="color:#00d4ff">'+d.driver_phone+'</a></div>':'') +
        (d.estimated_delivery?'<div style="grid-column:span 2"><span style="color:#f59e0b">📅 Est. Delivery:</span> <span style="color:#fff">'+new Date(d.estimated_delivery).toLocaleString()+'</span></div>':'') +
        (d.delivered_date?'<div style="grid-column:span 2"><span style="color:#22c55e">✅ Delivered:</span> <span style="color:#fff">'+new Date(d.delivered_date).toLocaleString()+'</span></div>':'') +
        '</div>' +
        (d.notes?'<p style="color:#555;font-size:0.8rem;margin:0.8rem 0 0;border-top:1px solid rgba(255,255,255,0.05);padding-top:0.5rem">📝 '+d.notes+'</p>':'') +
        '</div>';
    });
    el.innerHTML = htmlD;
  } catch(e) { el.innerHTML = '<h3 style="color:#00d4ff">🚚 My Deliveries</h3><p style="color:#ff3232">Error loading deliveries</p>'; }
};
