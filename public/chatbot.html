<style>
#chatbot{position:fixed;bottom:20px;right:20px;z-index:9998}
#chatToggle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#7b2ff7);border:none;color:#fff;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 20px rgba(0,212,255,0.4);transition:transform 0.3s}
#chatToggle:hover{transform:scale(1.1)}
#chatWindow{display:none;position:fixed;bottom:90px;right:20px;width:380px;max-height:520px;border-radius:20px;overflow:hidden;flex-direction:column}
#chatMessages{flex:1;overflow-y:auto;padding:1rem;max-height:400px}
.chat-msg{margin-bottom:0.8rem;padding:0.7rem 1rem;border-radius:12px;max-width:85%;font-size:0.9rem;line-height:1.5}
.chat-bot{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.15);color:#e0e0e0}
.chat-user{background:rgba(123,47,247,0.15);border:1px solid rgba(123,47,247,0.2);color:#e0e0e0;margin-left:auto}
#chatInput{display:flex;padding:0.5rem;border-top:1px solid rgba(255,255,255,0.1)}
#chatInput input{flex:1;padding:0.5rem 0.8rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;margin-right:0.5rem;font-size:0.9rem}
#chatInput button{padding:0.5rem 1rem;border-radius:8px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);border:none;color:#fff;cursor:pointer;font-weight:600}
</style>
<div id="chatbot"><button id="chatToggle" onclick="window.toggleChat()">💬</button></div>
<div id="chatWindow" class="glass-strong" style="background:rgba(10,14,39,0.97)">
  <div style="padding:0.8rem 1rem;background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;font-weight:600;border-radius:20px 20px 0 0">🤖 QS Assistant</div>
  <div id="chatMessages"></div>
  <div id="chatInput">
    <input id="chatMsg" placeholder="Type a message..." onkeypress="if(event.key==='Enter')window.sendChat()">
    <button onclick="window.sendChat()">➤</button>
  </div>
</div>

<script>
let chatOpen = false;
let ticketFlow = null; // null | 'awaiting_subject' | 'awaiting_message'

const kb = {
  plans: '💎 4 Investment Stages:\n\n🔹 Stage 1: $100–$1,000 → 100% Annual ROI\n🔹 Stage 2: $1,000–$10,000 → 90% Annual ROI\n🔹 Stage 3: $10,000–$100,000 → 80% Annual ROI\n🔹 Stage 4: $100,000–$1,000,000 → 70% Annual ROI\n\nYour stage auto-assigns based on total deposits.',
  deposit: '💰 To make a deposit:\n1. Go to Dashboard → Deposit\n2. Enter amount ($100 minimum)\n3. Choose payment method\n4. Submit and await admin approval\n\nAccepted: Bitcoin, Cash App, PayPal, Zelle, Wire Transfer, Western Union',
  withdraw: '💸 To withdraw:\n1. Go to Dashboard → Withdraw\n2. Enter amount and wallet address\n3. Admin will review and approve\n\nWithdrawals go to your preferred payment method.',
  bitcoin: '₿ Bitcoin Deposit:\n\nWallet: bc1q04k3fuas4eratzmv9padu9zjf7dwh4xv0s23k6\n\n1. Send BTC to the address above\n2. Go to Dashboard → Deposit\n3. Select Bitcoin as payment method\n4. Enter the USD equivalent amount\n5. Submit and await confirmation',
  support: '📞 Contact Support:\n\n📧 Email: quantumspacex1@gmail.com\n📱 Phone: +1 (262) 526-7600\n✈️ Telegram: @quantumspacex1\n\nOr type "ticket" to create a support ticket!',
  shop: '🛍️ Shop — Tesla & Optimus:\n\n🚗 Tesla Model S — $79,990\n🚙 Tesla Model Y — $49,990\n⚡ Tesla Model 3 — $42,990\n🏎️ Tesla Model X — $89,990\n🤖 Cybertruck — $69,990\n🦾 Optimus Bot — $25,000\n\nVisit the Shop page to order!',
  wallet: '💳 Your Wallet has 4 balances:\n\n💰 Deposit Balance — Your deposited funds\n📈 ROI Balance — Daily ROI earnings\n🎁 Bonus Balance — Admin bonuses\n🏆 Total ROI Earned — Cumulative ROI\n\nROI is deposited daily into your ROI wallet.'
};

window.toggleChat = function() {
  chatOpen = !chatOpen;
  document.getElementById('chatWindow').style.display = chatOpen ? 'flex' : 'none';
  if (chatOpen && !document.getElementById('chatMessages').children.length) {
    addBotMsg("Hello! I'm the QS Assistant 🚀\n\nI can help with:\n• Investment plans\n• Deposits & withdrawals\n• Bitcoin payments\n• Shop orders\n• Wallet info\n• Support tickets\n\nWhat would you like to know?");
  }
};

function addBotMsg(t) {
  const d = document.createElement('div');
  d.className = 'chat-msg chat-bot';
  d.style.whiteSpace = 'pre-wrap';
  d.textContent = t;
  document.getElementById('chatMessages').appendChild(d);
  document.getElementById('chatMessages').scrollTop = 99999;
}

function addUserMsg(t) {
  const d = document.createElement('div');
  d.className = 'chat-msg chat-user';
  d.textContent = t;
  document.getElementById('chatMessages').appendChild(d);
  document.getElementById('chatMessages').scrollTop = 99999;
}

window.sendChat = function() {
  const input = document.getElementById('chatMsg');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addUserMsg(msg);

  // Support ticket flow
  if (ticketFlow === 'awaiting_subject') {
    ticketFlow = { subject: msg, step: 'awaiting_message' };
    addBotMsg('Got it! Now please describe your issue in detail:');
    return;
  }
  if (ticketFlow && ticketFlow.step === 'awaiting_message') {
    const subject = ticketFlow.subject;
    const message = msg;
    ticketFlow = null;
    // Submit ticket
    (async function() {
      try {
        const r = await (await fetch('/api/support/ticket', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({user_id: (currentUser && currentUser.id) || 0, subject, message})
        })).json();
        if (r.id) {
          addBotMsg('✅ Support ticket #' + r.id + ' created!\n\nOur team will respond via email. You can also reach us directly:\n📧 quantumspacex1@gmail.com\n📱 +1 (262) 526-7600');
        } else {
          addBotMsg('❌ Failed to create ticket. Please contact support directly:\n📧 quantumspacex1@gmail.com');
        }
      } catch(e) {
        addBotMsg('❌ Error creating ticket. Please email: quantumspacex1@gmail.com');
      }
    })();
    return;
  }

  // Normal chat matching
  const low = msg.toLowerCase();
  if (low.match(/plan|stage|invest|roi/)) addBotMsg(kb.plans);
  else if (low.match(/deposit|fund|add money|pay/)) addBotMsg(kb.deposit);
  else if (low.match(/withdraw|cash out|payout/)) addBotMsg(kb.withdraw);
  else if (low.match(/bitcoin|btc|crypto/)) addBotMsg(kb.bitcoin);
  else if (low.match(/support|help|contact|email|phone|telegram/)) addBotMsg(kb.support);
  else if (low.match(/shop|tesla|bot|buy|order|product/)) addBotMsg(kb.shop);
  else if (low.match(/wallet|balance|account/)) addBotMsg(kb.wallet);
  else if (low.match(/ticket|issue|problem|report/)) {
    ticketFlow = 'awaiting_subject';
    addBotMsg('🎫 Let me create a support ticket for you.\n\nFirst, enter a subject/title for your issue:');
  }
  else {
    addBotMsg("I can help with:\n• Plans — Investment stages & ROI\n• Deposit — How to fund your account\n• Withdraw — Cash out process\n• Bitcoin — BTC payment details\n• Wallet — Your wallet info\n• Shop — Tesla & Optimus orders\n• Support — Contact info\n• Ticket — Create a support ticket\n\nWhat would you like to know?");
  }
};
</script>
