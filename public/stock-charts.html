<div style="max-width:1200px;margin:0 auto;padding:2rem">
<h2 style="color:#00d4ff;margin-bottom:1.5rem">📈 Markets & Stock Trading</h2>

<div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap">
<button class="btn btn-primary btn-sm" onclick="window.showMarketTab('overview')">Overview</button>
<button class="btn btn-outline btn-sm" onclick="window.showMarketTab('portfolio')">Portfolio</button>
<button class="btn btn-outline btn-sm" onclick="window.showMarketTab('stocks')">Buy Stocks</button>
<button class="btn btn-outline btn-sm" onclick="window.showMarketTab('my-trades')">My Trades</button>
</div>

<div id="marketContent" class="glass" style="padding:2rem"></div>
</div>

<script>
const stocks = [
  {symbol:'TSLA',name:'Tesla Inc.',price:248.50,change:3.2,sector:'EV'},
  {symbol:'SPCE',name:'Virgin Galactic',price:12.80,change:-1.5,sector:'Space'},
  {symbol:'BA',name:'Boeing Co.',price:178.30,change:0.8,sector:'Aero'},
  {symbol:'LMT',name:'Lockheed Martin',price:475.20,change:1.1,sector:'Defense'},
  {symbol:'RKLB',name:'Rocket Lab',price:8.45,change:5.3,sector:'Space'},
  {symbol:'ASTR',name:'Astra Space',price:3.20,change:-2.1,sector:'Space'},
  {symbol:'JOBY',name:'Joby Aviation',price:6.75,change:2.8,sector:'eVTOL'},
  {symbol:'PCAR',name:'Paccar Inc.',price:102.40,change:0.5,sector:'EV'},
  {symbol:'GM',name:'General Motors',price:45.60,change:1.2,sector:'Auto'},
  {symbol:'F',name:'Ford Motor',price:14.30,change:-0.3,sector:'Auto'},
  {symbol:'RIVN',name:'Rivian Auto.',price:18.90,change:4.1,sector:'EV'},
  {symbol:'LCID',name:'Lucid Motors',price:5.40,change:-1.8,sector:'EV'},
  {symbol:'NIO',name:'NIO Inc.',price:7.80,change:2.5,sector:'EV'},
  {symbol:'MSTR',name:'MicroStrategy',price:1650.00,change:6.2,sector:'Crypto'}
];

window.showMarketTab = function(tab) {
  // Highlight active tab
  const btns = document.querySelectorAll('.btn-sm');
  btns.forEach(b => { b.className = b.textContent.toLowerCase().includes(tab) ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm'; });
  
  const el = document.getElementById('marketContent');
  
  if (tab === 'overview') {
    let html = '<h3 style="color:#00d4ff;margin-bottom:1rem">📊 Market Overview</h3>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem">';
    stocks.forEach(s => {
      const color = s.change >= 0 ? '#22c55e' : '#ff3232';
      const arrow = s.change >= 0 ? '▲' : '▼';
      html += `<div class="glass" style="padding:1rem;border-left:3px solid ${color};cursor:pointer" onclick="window.showMarketTab('stocks')">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><p style="font-weight:700;color:#fff;margin:0;font-size:1rem">${s.symbol}</p><p style="color:#a0a0c0;font-size:0.8rem;margin:0">${s.name}</p></div>
          <div style="text-align:right"><p style="font-size:1.2rem;font-weight:700;color:#fff;margin:0">$${s.price.toFixed(2)}</p><p style="color:${color};font-size:0.85rem;margin:0">${arrow} ${Math.abs(s.change)}%</p></div>
        </div>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
    
  } else if (tab === 'portfolio') {
    if (!token) { el.innerHTML = '<p style="color:#a0a0c0;text-align:center;padding:2rem">Please <a onclick="showLogin()" style="cursor:pointer">login</a> to view your portfolio.</p>'; return; }
    el.innerHTML = '<h3 style="color:#00d4ff">📊 Your Portfolio</h3><p style="color:#a0a0c0">Loading...</p>';
    (async function() {
      try {
        const w = await (await fetch('/api/user/wallet')).json();
        const u = await (await fetch('/api/user/profile')).json();
        el.innerHTML = `<h3 style="color:#00d4ff;margin-bottom:1.5rem">📊 Your Portfolio</h3>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem">
          <div class="glass" style="padding:1.2rem;text-align:center"><p style="color:#a0a0c0;font-size:0.8rem">Total Balance</p><p style="font-size:1.5rem;font-weight:700;color:#00d4ff">$${(u.balance||0).toFixed(2)}</p></div>
          <div class="glass" style="padding:1.2rem;text-align:center"><p style="color:#a0a0c0;font-size:0.8rem">Deposit Balance</p><p style="font-size:1.5rem;font-weight:700">$${(w.deposit_balance||0).toFixed(2)}</p></div>
          <div class="glass" style="padding:1.2rem;text-align:center"><p style="color:#a0a0c0;font-size:0.8rem">ROI Balance</p><p style="font-size:1.5rem;font-weight:700;color:#22c55e">$${(w.roi_balance||0).toFixed(2)}</p></div>
          <div class="glass" style="padding:1.2rem;text-align:center"><p style="color:#a0a0c0;font-size:0.8rem">Bonus Balance</p><p style="font-size:1.5rem;font-weight:700;color:#f59e0b">$${(w.bonus_balance||0).toFixed(2)}</p></div>
        </div>
        <div class="glass" style="padding:1.2rem;text-align:center">
          <p style="color:#a0a0c0;font-size:0.85rem">Stage: <strong style="color:#00d4ff">${w.stage}</strong> | Annual ROI: <strong style="color:#22c55e">${w.roi}%</strong></p>
        </div>`;
      } catch(e) { el.innerHTML = '<h3 style="color:#00d4ff">📊 Portfolio</h3><p style="color:#ff3232">Error loading portfolio</p>'; }
    })();
    
  } else if (tab === 'stocks') {
    let html = '<h3 style="color:#00d4ff;margin-bottom:1rem">📈 Buy & Sell Stocks</h3>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:0.9rem"><thead><tr style="color:#a0a0c0"><th style="text-align:left;padding:0.5rem">Symbol</th><th style="text-align:left;padding:0.5rem">Name</th><th style="text-align:left;padding:0.5rem">Price</th><th style="text-align:left;padding:0.5rem">Change</th><th style="text-align:center;padding:0.5rem">Buy</th><th style="text-align:center;padding:0.5rem">Sell</th></tr></thead><tbody>';
    stocks.forEach(s => {
      const color = s.change >= 0 ? '#22c55e' : '#ff3232';
      html += `<tr style="border-top:1px solid rgba(255,255,255,0.05)">
        <td style="padding:0.5rem;font-weight:700">${s.symbol}</td>
        <td style="padding:0.5rem;color:#a0a0c0">${s.name}</td>
        <td style="padding:0.5rem;font-weight:600">$${s.price.toFixed(2)}</td>
        <td style="padding:0.5rem;color:${color};font-weight:600">${s.change>=0?'+':''}${s.change}%</td>
        <td style="padding:0.5rem;text-align:center"><button class="btn btn-success btn-sm" onclick="window.buyStock('${s.symbol}',${s.price})">Buy</button></td>
        <td style="padding:0.5rem;text-align:center"><button class="btn btn-outline btn-sm" style="border-color:#f59e0b;color:#f59e0b" onclick="window.sellStock('${s.symbol}',${s.price})">Sell</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    html += '<p style="color:#a0a0c0;font-size:0.8rem;margin-top:1rem">💡 All stock trades require admin approval. Buy = deposit to wallet, Sell = withdrawal to ROI wallet.</p>';
    el.innerHTML = html;
    
  } else if (tab === 'my-trades') {
    if (!token) { el.innerHTML = '<p style="color:#a0a0c0;text-align:center;padding:2rem">Please <a onclick="showLogin()" style="cursor:pointer">login</a> to view trades.</p>'; return; }
    el.innerHTML = '<h3 style="color:#00d4ff">📋 My Stock Trades</h3><p style="color:#a0a0c0">Loading...</p>';
    (async function() {
      try {
        const trades = await (await fetch('/api/user/stock/trades')).json();
        if (!trades.length) { el.innerHTML = '<h3 style="color:#00d4ff">📋 My Stock Trades</h3><p style="color:#a0a0c0">No trades yet. Go to "Buy Stocks" to start!</p>'; return; }
        let html = '<h3 style="color:#00d4ff;margin-bottom:1rem">📋 My Stock Trades</h3><table style="width:100%;border-collapse:collapse;font-size:0.85rem"><thead><tr style="color:#a0a0c0"><th style="text-align:left;padding:0.4rem">Symbol</th><th style="text-align:left;padding:0.4rem">Type</th><th style="text-align:left;padding:0.4rem">Shares</th><th style="text-align:left;padding:0.4rem">Price</th><th style="text-align:left;padding:0.4rem">Total</th><th style="text-align:left;padding:0.4rem">Status</th></tr></thead><tbody>';
        trades.forEach(t => {
          const c = t.status==='completed'?'#22c55e':t.status==='rejected'?'#ff3232':'#f59e0b';
          html += `<tr style="border-top:1px solid rgba(255,255,255,0.05)"><td style="padding:0.4rem;font-weight:600">${t.symbol}</td><td style="padding:0.4rem;color:${t.type==='buy'?'#22c55e':'#f59e0b'}">${t.type.toUpperCase()}</td><td style="padding:0.4rem">${t.shares}</td><td style="padding:0.4rem">$${t.price}</td><td style="padding:0.4rem">$${t.total.toFixed(2)}</td><td style="padding:0.4rem;color:${c}">${t.status}</td></tr>`;
        });
        html += '</tbody></table>';
        el.innerHTML = html;
      } catch(e) { el.innerHTML = '<h3 style="color:#00d4ff">📋 Trades</h3><p style="color:#ff3232">Error loading trades</p>'; }
    })();
  }
};

window.buyStock = async function(symbol, price) {
  if (!token) { showLogin(); return; }
  const shares = prompt(`How many shares of ${symbol} at $${price.toFixed(2)}?`);
  if (!shares || parseFloat(shares) <= 0) return;
  const total = (parseFloat(shares) * price).toFixed(2);
  if (!confirm(`Confirm: Buy ${shares} shares of ${symbol} at $${price.toFixed(2)} = $${total}\n\nThis will create a deposit request for admin approval.`)) return;
  try {
    const r = await (await fetch('/api/user/stock/buy', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({symbol, shares: parseFloat(shares), price})
    })).json();
    if (r.error) return showToast(r.error, 'error');
    showToast('Stock buy submitted! Ref: ' + r.reference, 'success');
  } catch(e) { showToast('Failed to submit', 'error'); }
};

window.sellStock = async function(symbol, price) {
  if (!token) { showLogin(); return; }
  const shares = prompt(`How many shares of ${symbol} to sell at $${price.toFixed(2)}?`);
  if (!shares || parseFloat(shares) <= 0) return;
  const total = (parseFloat(shares) * price).toFixed(2);
  if (!confirm(`Confirm: Sell ${shares} shares of ${symbol} at $${price.toFixed(2)} = $${total}\n\nProceeds will go to your ROI wallet after admin approval.`)) return;
  try {
    const r = await (await fetch('/api/user/stock/sell', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({symbol, shares: parseFloat(shares), price})
    })).json();
    if (r.error) return showToast(r.error, 'error');
    showToast('Stock sell submitted! Ref: ' + r.reference, 'success');
  } catch(e) { showToast('Failed to submit', 'error'); }
};

window.showMarketTab('overview');
</script>
